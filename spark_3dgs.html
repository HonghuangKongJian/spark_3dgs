<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splat Viewer - Fixed</title>
  <style> 
    body { margin: 0; overflow: hidden; background-color: #111; } 
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 8px;
      color: white;
      font-family: sans-serif;
      pointer-events: auto; /* 确保UI可点击 */
    }
    input[type=file] { color: white; margin-bottom: 5px; }
    .instructions { font-size: 0.85em; color: #aaa; line-height: 1.4em; }
  </style>
</head>
<body>

<div id="ui-container">
  <div style="font-weight:bold; margin-bottom:8px;">Splat Viewer</div>
  <input type="file" id="fileInput" accept=".ply,.spz,.splat">
  <div class="instructions">
    • 左键拖拽: 旋转<br>
    • 右键拖拽: 平移<br>
    • 滚轮: 缩放
  </div>
  <div id="status" style="margin-top:5px; color:#4f4;">Ready</div>
</div>

<div id="errbox" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff5555; font-family:sans-serif; background:rgba(0,0,0,0.85); padding:16px; border-radius:8px; max-width:80%; z-index:200; white-space:pre-wrap; line-height:1.5;"></div>

<div id="infobox" style="display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%); color:#ffd24d; font-family:sans-serif; background:rgba(0,0,0,0.8); padding:10px 14px; border-radius:8px; max-width:80%; z-index:200; white-space:pre-wrap; line-height:1.5; text-align:center;"></div>

<!--
  模块加载看门狗：若 ESM 模块导入失败（CDN 404/解析错误/无 WebGL），
  模块内代码不会执行，因此错误捕获必须放在模块外部的经典脚本里。
-->
<script>
  window.__sparkReady = false;
  function __showInfo(text) {
    var box = document.getElementById('infobox');
    if (box) { box.style.display = 'block'; box.textContent = text; }
  }
  // file:// 为不透明源，Spark 2.x 的 Worker 无法 fetch blob: 本地文件，故【选择本地文件】会失败。
  // 默认 CDN 模型不受影响；本地文件请用 http(s) 方式打开本页。
  if (location.protocol === 'file:') {
    __showInfo('当前以 file:// 方式打开：默认模型(CDN)可正常显示，但【选择本地文件】会因浏览器安全限制失败。\n请改用本地 HTTP 服务打开本页（例如在文件目录运行 python -m http.server 8000，再访问 http://localhost:8000/spark_3dgs.html）。');
  }
  function __showErr(text) {
    var box = document.getElementById('errbox');
    if (box) { box.style.display = 'block'; box.textContent = text; }
  }
  // useCapture=true 才能捕获 <script>/<link> 等资源加载错误
  window.addEventListener('error', function (e) {
    var msg = e.message || (e.target && (e.target.src || e.target.href) ? ('资源加载失败: ' + (e.target.src || e.target.href)) : '未知错误');
    __showErr('加载出错：\n' + msg + '\n\n请按 F12 打开控制台查看详细报错。');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    __showErr('运行时错误：\n' + ((e.reason && e.reason.message) || e.reason) + '\n\n请按 F12 打开控制台查看详细报错。');
  });
  setTimeout(function () {
    if (!window.__sparkReady) {
      __showErr('加载超时（8 秒）。可能原因：\n1) 网络无法访问 CDN（jsdelivr / sparkjs.dev）\n2) 浏览器不支持 WebGL\n3) ESM 模块导入失败\n\n请按 F12 打开控制台查看详细报错。');
    }
  }, 8000);
</script>

<!--
  使用 jsdelivr 作为 three 模块源（Spark 2.x 内部会 import "three/addons/..."，
  用统一的 importmap 可确保 app / OrbitControls / Spark 三处引用的是同一个 three 实例）。
-->
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
</script>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

  // 用于调试：如果出错，会在控制台看到
  window.onerror = function(msg, url, line) {
    document.getElementById('status').innerText = "Error: " + msg;
    document.getElementById('status').style.color = "red";
  };

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111); // 给个深灰背景，便于确认渲染器是否工作

  // 修复点 2: 调整相机参数
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1, 3); // 稍微抬高一点，距离拉近一点

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Spark 2.x 关键变更：必须创建 SparkRenderer 并加入场景，
  // 它负责在 Three.js 渲染循环中驱动高斯泼溅的专用渲染通道。
  const spark = new SparkRenderer({ renderer });
  scene.add(spark);

  // 初始化控制器
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = false
  controls.autoRotateSpeed = 1.0;
  // 确保控制器围绕中心点
  controls.target.set(0, 0, 0);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  let currentSplat = null;

  async function loadSplat(url) {
    document.getElementById('status').innerText = "Loading...";
    
    try {
      if (currentSplat) {
        scene.remove(currentSplat);
        currentSplat.dispose?.(); // Spark 2.x: 推荐用 dispose() 释放 SplatMesh 占用的 GPU 资源
        if (currentSplat.geometry) currentSplat.geometry.dispose();
        if (currentSplat.material) currentSplat.material.dispose();
        currentSplat = null;
      }

      const splat = new SplatMesh({ url: url });
      
      // 修复点 3: 等待加载完成后再操作，虽然 SplatMesh 是异步渲染，但添加到场景是同步的
      scene.add(splat);
      currentSplat = splat;

      // 修复点 4: 调整模型位置和旋转
      splat.position.set(0, 0, 0);
      
      // 原始代码使用了这个四元数，可能是为了纠正坐标系 (Y-up vs Z-up)
      // 如果发现模型是黑的或者看不见，可以尝试注释掉下面这一行
      splat.quaternion.set(1, 0, 0, 0); 
      
      document.getElementById('status').innerText = "Loaded";

    } catch (e) {
      console.error(e);
      document.getElementById('status').innerText = "Error loading";
    }
  }

  // 加载默认模型
  loadSplat("https://sparkjs.dev/assets/splats/butterfly.spz");

  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (file) {
      const objectUrl = URL.createObjectURL(file);
      loadSplat(objectUrl);
      controls.reset();
    }
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });

  // 标记模块已成功初始化，关闭加载看门狗
  window.__sparkReady = true;
</script>

</body>
</html>
